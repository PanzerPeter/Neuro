name: "Setup LLVM 23"
description: "Installs LLVM 23 and sets LLVM_SYS_231_PREFIX for llvm-sys-231.x"
inputs:
  mlir:
    description: >-
      Also install the MLIR 23 dev libraries + a matching libclang 23 (Linux
      only) and export MLIR_SYS_230_PREFIX / TABLEGEN_230_PREFIX / LIBCLANG_PATH.
      Required only by jobs that enable the mlir-backend `mlir` feature (e.g. the
      `--all-features` lint job). Default builds do not need it.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:

    # ── Linux ──────────────────────────────────────────────────────────────────
    # GitHub's Ubuntu runners reach archive.ubuntu.com through an Azure mirror
    # list that intermittently blackholes connections (the repeated `Ign:` lines
    # in a stuck log). apt applies no network timeout by default, so a blackholed
    # mirror leaves `apt-get update` waiting indefinitely and the job burns its
    # whole budget without ever producing a failure. Every fetch below is
    # therefore bounded and retried, and apt waits for the dpkg lock (held early
    # in a runner's life by unattended-upgrades) instead of aborting on it.
    - name: Install LLVM 23 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        sudo tee /etc/apt/apt.conf.d/99-neuro-ci > /dev/null <<'APTCONF'
        Acquire::Retries "3";
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::ftp::Timeout "20";
        DPkg::Lock::Timeout "300";
        APTCONF

        # Bound a single attempt, then retry the whole command. `timeout` runs
        # under sudo so it signals apt itself rather than the sudo wrapper.
        apt_retry() {
          local attempt
          for attempt in 1 2 3; do
            if sudo timeout -k 30 600 "$@"; then
              return 0
            fi
            echo "::warning::'$*' failed (attempt ${attempt}/3), retrying in 15s"
            # A killed apt can leave half-unpacked packages behind; clear that
            # before the next attempt so the retry is not doomed from the start.
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "::error::'$*' failed after 3 attempts"
          return 1
        }

        wget --timeout=20 --tries=3 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null

        echo "deb http://apt.llvm.org/$(lsb_release -cs)/ \
          llvm-toolchain-$(lsb_release -cs)-23 main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list

        apt_retry apt-get update -q
        apt_retry apt-get install -y \
          llvm-23 \
          llvm-23-dev \
          llvm-23-tools \
          libpolly-23-dev \
          libzstd-dev \
          zlib1g-dev

        # Sanity-check: ensure llvm-config resolves the correct version
        /usr/lib/llvm-23/bin/llvm-config --version | grep -E "^23\." \
          || { echo "ERROR: unexpected LLVM version"; exit 1; }

        {
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23"
          echo "LLVM_LINK_LLVM_DYLIB=1"
          echo "PATH=/usr/lib/llvm-23/bin:$PATH"
        } >> "$GITHUB_ENV"

    # ── MLIR 23 + libclang 23 (Linux, opt-in) ──────────────────────────────────
    # mlir-sys runs bindgen over the MLIR-C headers at build time and needs a
    # libclang whose major version matches the headers (libclang 23 here). The
    # apt.llvm.org llvm-23 channel ships both, so the version matches with no
    # workaround. Only jobs enabling the mlir-backend `mlir` feature request this.
    - name: Install MLIR 23 + libclang 23 (Linux)
      if: runner.os == 'Linux' && inputs.mlir == 'true'
      shell: bash
      run: |
        set -euo pipefail

        # Same bounded-retry shape as the step above; each composite step runs in
        # its own shell, so the helper is redefined rather than shared.
        apt_retry() {
          local attempt
          for attempt in 1 2 3; do
            if sudo timeout -k 30 600 "$@"; then
              return 0
            fi
            echo "::warning::'$*' failed (attempt ${attempt}/3), retrying in 15s"
            # A killed apt can leave half-unpacked packages behind; clear that
            # before the next attempt so the retry is not doomed from the start.
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "::error::'$*' failed after 3 attempts"
          return 1
        }

        # lld links the AMD code objects the neurc suite builds for `--gpu-arch gfx*`.
        apt_retry apt-get install -y \
          libmlir-23-dev \
          mlir-23-tools \
          libclang-23-dev \
          libclang-common-23-dev \
          lld-23

        test -f /usr/lib/llvm-23/include/mlir-c/IR.h \
          || { echo "ERROR: MLIR-C headers missing"; exit 1; }

        {
          echo "MLIR_SYS_230_PREFIX=/usr/lib/llvm-23"
          echo "TABLEGEN_230_PREFIX=/usr/lib/llvm-23"
          echo "LIBCLANG_PATH=/usr/lib/llvm-23/lib"
        } >> "$GITHUB_ENV"

    # ── macOS ──────────────────────────────────────────────────────────────────
    - name: Install LLVM 23 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        # Unlink any existing LLVM to avoid keg-only conflicts
        brew unlink llvm 2>/dev/null || true
        # Homebrew has no llvm@23 while 23 is current: the unversioned formula is
        # 23, and the version check below fails the job when it moves to 24.
        brew install llvm

        LLVM_PREFIX="$(brew --prefix llvm)"

        "$LLVM_PREFIX/bin/llvm-config" --version | grep -E "^23\." \
          || { echo "ERROR: unexpected LLVM version"; exit 1; }

        {
          echo "LLVM_SYS_231_PREFIX=$LLVM_PREFIX"
          echo "PATH=$LLVM_PREFIX/bin:$PATH"
          # macOS links statically by default: do NOT set LLVM_LINK_LLVM_DYLIB
        } >> "$GITHUB_ENV"

    # ── Windows ──────────────────────────────────────────────────────────────────
    # LLVM's own release ships a full MSVC development build as
    # clang+llvm-<ver>-x86_64-pc-windows-msvc.tar.xz: llvm-config.exe, headers and
    # every static .lib llvm-sys needs. (The NSIS .exe installer does not; it holds
    # only Clang and LLVM-C.dll.) The archive is pinned by SHA-256, the digest
    # GitHub records for the release asset.
    #
    # Two properties of that build shape the steps below:
    #   - It is compiled against the static CRT (/MT). `.cargo/config.toml`
    #     builds Rust with +crt-static on this target to match; a /MD Rust build
    #     would pull both CRTs into one link.
    #   - Its llvm-config lists `xml2s.lib` among the system libraries, because
    #     LLVMWindowsManifest uses libxml2. Nothing inkwell calls reaches that
    #     library, so no object from it is ever linked, but link.exe still fails
    #     with LNK1181 when a named library is missing. A static libxml2 from the
    #     runner's vcpkg is copied into the LLVM lib directory under that name.
    #
    # The archive carries a subset of backends (X86, AArch64, ARM, BPF, NVPTX,
    # RISCV, WebAssembly), which is why inkwell uses `target-x86` and not
    # `target-all`. The pruned prefix is cached per version.

    - name: Cache LLVM 23 (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      id: llvm-cache
      with:
        path: C:\LLVM
        key: llvm-23.1.2-x86_64-pc-windows-msvc-xml2s

    - name: Install LLVM 23 (Windows)
      if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $version = "23.1.2"
        $sha256  = "8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095"
        $asset   = "clang+llvm-$version-x86_64-pc-windows-msvc"
        $url     = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$asset.tar.xz"
        $archive = "$env:TEMP\$asset.tar.xz"
        $extract = "$env:TEMP\llvm-extract"
        $prefix  = "C:\LLVM"

        Write-Host "Downloading $url ..."
        # Retry curl to absorb transient GitHub release CDN errors.
        curl.exe -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o $archive $url
        if ($LASTEXITCODE -ne 0) { throw "curl failed (exit $LASTEXITCODE)" }

        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
        if ($actual -ne $sha256) { throw "SHA-256 mismatch: expected $sha256, got $actual" }

        Write-Host "Extracting $archive ..."
        if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
        New-Item -ItemType Directory -Force -Path $extract | Out-Null
        # Windows' bundled bsdtar reads .tar.xz directly.
        tar.exe -xf $archive -C $extract
        if ($LASTEXITCODE -ne 0) { throw "tar extract failed (exit $LASTEXITCODE)" }

        $inner = Join-Path $extract $asset
        if (-not (Test-Path $inner)) { throw "Could not locate extracted LLVM root in $extract" }

        if (Test-Path $prefix) { Remove-Item -Recurse -Force $prefix }
        Move-Item -Path $inner -Destination $prefix

        Remove-Item $archive -ErrorAction SilentlyContinue
        Remove-Item -Recurse -Force $extract -ErrorAction SilentlyContinue

        # Keep only what llvm-sys reads: llvm-config, the LLVM headers and the
        # LLVM*.lib archives. Dropping clang, lld and lldb keeps the cache small
        # and leaves no second clang on PATH to change which one neurc links with.
        Get-ChildItem "$prefix\bin" | Where-Object Name -ne 'llvm-config.exe' | Remove-Item -Recurse -Force
        Get-ChildItem "$prefix\include" | Where-Object Name -notin 'llvm', 'llvm-c' | Remove-Item -Recurse -Force
        Get-ChildItem "$prefix\lib" | Where-Object { $_.Name -notlike 'LLVM*.lib' -and $_.Name -ne 'cmake' } | Remove-Item -Recurse -Force
        Get-ChildItem "$prefix\lib\cmake" | Where-Object Name -ne 'llvm' | Remove-Item -Recurse -Force
        Get-ChildItem $prefix | Where-Object Name -notin 'bin', 'include', 'lib' | Remove-Item -Recurse -Force

        # [core] drops the iconv and zlib defaults: they would only add more
        # libraries that llvm-config does not name.
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install "libxml2[core]:x64-windows-static"
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install libxml2 failed (exit $LASTEXITCODE)" }
        # The archive's file name follows libxml2's own CMake naming, which is not
        # stable across releases (`libxml2s.lib` up to 2.14, a different name in
        # 2.15), so it is found by pattern. Any static libxml2 satisfies the link.
        $xml2dir = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static\lib"
        $xml2 = Get-ChildItem $xml2dir -Filter '*xml2*.lib' | Sort-Object Name -Descending | Select-Object -First 1
        if (-not $xml2) {
          Get-ChildItem $xml2dir | Format-Table Name, Length | Out-String | Write-Host
          throw "vcpkg produced no static libxml2 archive in $xml2dir"
        }
        Write-Host "Using $($xml2.FullName) as xml2s.lib"
        Copy-Item $xml2.FullName "$prefix\lib\xml2s.lib"

    - name: Configure LLVM env (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $prefix = "C:\LLVM"

        $llvmConfig = "$prefix\bin\llvm-config.exe"
        if (-not (Test-Path $llvmConfig)) {
          throw "llvm-config.exe not found at $llvmConfig"
        }

        $detected = & $llvmConfig --version
        Write-Host "Detected LLVM version: $detected"
        if ($detected -notmatch '^23\.') {
          throw "Unexpected LLVM version '$detected'; expected 23.x"
        }
        Write-Host "LLVM prefix: $prefix"

        # llvm-sys on Windows/MSVC links statically: do NOT set
        # LLVM_LINK_LLVM_DYLIB.
        "LLVM_SYS_231_PREFIX=$prefix" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
        "$prefix\bin"                  | Out-File $env:GITHUB_PATH -Append -Encoding utf8

        # Under +crt-static, llvm-sys emits the system libraries llvm-config names
        # (psapi, shell32, ole32, uuid, advapi32, ws2_32, ntdll) as `static=` links.
        # rustc then has to find each .lib itself to bundle it into the llvm-sys
        # rlib, and it searches only its -L paths, never the linker's LIB, so it
        # fails with "could not find native static library `psapi`". The Windows
        # SDK directory that holds them is added as a search path. It goes into
        # Cargo's home config rather than RUSTFLAGS: Cargo joins config arrays,
        # while RUSTFLAGS would replace the repository's +crt-static.
        $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib'
        $sdk = Get-ChildItem $kits -Directory |
          Where-Object { Test-Path (Join-Path $_.FullName 'um\x64\psapi.lib') } |
          Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
        if (-not $sdk) { throw "No Windows SDK with um\x64\psapi.lib under $kits" }
        $um = Join-Path $sdk.FullName 'um\x64'
        Write-Host "Windows SDK libraries: $um"
        $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
        New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
        @"
        [target.x86_64-pc-windows-msvc]
        rustflags = ['-L', 'native=$um']
        "@ | Out-File (Join-Path $cargoHome 'config.toml') -Append -Encoding utf8

    - name: Verify LLVM prefix is set
      shell: bash
      run: |
        : "${LLVM_SYS_231_PREFIX:?LLVM_SYS_231_PREFIX is not set, LLVM install failed}"
        echo "LLVM_SYS_231_PREFIX = $LLVM_SYS_231_PREFIX"
        # Use llvm-config from PATH (bin dir was added above) to avoid
        # backslash path issues on Windows runners using Git Bash.
        llvm-config --version
