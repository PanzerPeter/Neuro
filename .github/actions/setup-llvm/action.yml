name: "Setup LLVM 23 + MLIR 23"
description: "Installs LLVM 23 with MLIR 23 and sets the llvm-sys, mlir-sys and tblgen prefixes"
inputs:
  build:
    description: >-
      Windows only: build the LLVM + MLIR prefix from source when the cache has
      none, instead of failing. Only CI's toolchain job sets it, so a cold cache
      costs one build rather than one per job, each racing its own timeout.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:

    # ── Linux ──────────────────────────────────────────────────────────────────
    # GitHub's Ubuntu runners reach archive.ubuntu.com through an Azure mirror
    # list that intermittently blackholes connections (the repeated `Ign:` lines
    # in a stuck log). apt applies no network timeout by default, so a blackholed
    # mirror leaves `apt-get update` waiting indefinitely and the job burns its
    # whole budget without ever producing a failure. Every fetch below is
    # therefore bounded and retried, and apt waits for the dpkg lock (held early
    # in a runner's life by unattended-upgrades) instead of aborting on it.
    - name: Install LLVM 23 (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail

        sudo tee /etc/apt/apt.conf.d/99-neuro-ci > /dev/null <<'APTCONF'
        Acquire::Retries "3";
        Acquire::http::Timeout "20";
        Acquire::https::Timeout "20";
        Acquire::ftp::Timeout "20";
        DPkg::Lock::Timeout "300";
        APTCONF

        # Bound a single attempt, then retry the whole command. `timeout` runs
        # under sudo so it signals apt itself rather than the sudo wrapper.
        apt_retry() {
          local attempt
          for attempt in 1 2 3; do
            if sudo timeout -k 30 600 "$@"; then
              return 0
            fi
            echo "::warning::'$*' failed (attempt ${attempt}/3), retrying in 15s"
            # A killed apt can leave half-unpacked packages behind; clear that
            # before the next attempt so the retry is not doomed from the start.
            sudo dpkg --configure -a || true
            sleep 15
          done
          echo "::error::'$*' failed after 3 attempts"
          return 1
        }

        wget --timeout=20 --tries=3 -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null

        echo "deb http://apt.llvm.org/$(lsb_release -cs)/ \
          llvm-toolchain-$(lsb_release -cs)-23 main" \
          | sudo tee /etc/apt/sources.list.d/llvm.list

        apt_retry apt-get update -q
        # mlir-sys runs bindgen over the MLIR-C headers and needs a libclang whose
        # major version matches them, which the same channel ships. lld links the AMD
        # code objects the neurc suite builds for `--gpu-arch gfx*`.
        apt_retry apt-get install -y \
          llvm-23 \
          llvm-23-dev \
          llvm-23-tools \
          libpolly-23-dev \
          libmlir-23-dev \
          mlir-23-tools \
          libclang-23-dev \
          libclang-common-23-dev \
          lld-23 \
          libzstd-dev \
          zlib1g-dev

        # Sanity-check: ensure llvm-config resolves the correct version
        /usr/lib/llvm-23/bin/llvm-config --version | grep -E "^23\." \
          || { echo "ERROR: unexpected LLVM version"; exit 1; }
        test -f /usr/lib/llvm-23/include/mlir-c/IR.h \
          || { echo "ERROR: MLIR-C headers missing"; exit 1; }

        {
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23"
          echo "MLIR_SYS_230_PREFIX=/usr/lib/llvm-23"
          echo "TABLEGEN_230_PREFIX=/usr/lib/llvm-23"
          echo "LIBCLANG_PATH=/usr/lib/llvm-23/lib"
          echo "LLVM_LINK_LLVM_DYLIB=1"
          echo "PATH=/usr/lib/llvm-23/bin:$PATH"
        } >> "$GITHUB_ENV"

    # ── macOS ──────────────────────────────────────────────────────────────────
    - name: Install LLVM 23 (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail

        # Unlink any existing LLVM to avoid keg-only conflicts
        brew unlink llvm 2>/dev/null || true
        # Homebrew has no llvm@23 while 23 is current: the unversioned formula is
        # 23, and the version check below fails the job when it moves to 24. The
        # formula builds MLIR in, static libraries included, so one prefix serves
        # llvm-sys, mlir-sys and tblgen.
        brew install llvm

        LLVM_PREFIX="$(brew --prefix llvm)"

        "$LLVM_PREFIX/bin/llvm-config" --version | grep -E "^23\." \
          || { echo "ERROR: unexpected LLVM version"; exit 1; }
        test -f "$LLVM_PREFIX/include/mlir-c/IR.h" \
          || { echo "ERROR: MLIR-C headers missing from $LLVM_PREFIX"; exit 1; }

        {
          echo "LLVM_SYS_231_PREFIX=$LLVM_PREFIX"
          echo "MLIR_SYS_230_PREFIX=$LLVM_PREFIX"
          echo "TABLEGEN_230_PREFIX=$LLVM_PREFIX"
          echo "PATH=$LLVM_PREFIX/bin:$PATH"
          # macOS links statically by default: do NOT set LLVM_LINK_LLVM_DYLIB
        } >> "$GITHUB_ENV"

    # ── Windows ──────────────────────────────────────────────────────────────────
    # No Windows LLVM release carries MLIR, so CI builds LLVM and MLIR from the
    # 23.1.2 source tarball into one static prefix, the recipe the installation
    # guide gives for a local build, and caches it. One prefix matters: melior
    # hands inkwell an LLVM context, so both must link the same LLVM.
    #
    # The build choices that matter downstream:
    #   - The static CRT (/MT). `.cargo/config.toml` builds Rust with +crt-static
    #     on this target to match; a /MD Rust build would pull both CRTs into one
    #     link.
    #   - zlib, zstd, libxml2 and the DIA SDK off. llvm-config would otherwise
    #     list them among the system libraries, some by absolute path, which
    #     llvm-sys turns into rustc `-l` flags it cannot satisfy.
    #   - X86, NVPTX and AMDGPU only: the host, and the two GPU targets
    #     mlir-backend's unit tests lower to whatever the host OS.
    #   - No tools. Nothing downstream runs one except llvm-config, which the
    #     build adds by hand, and leaving out the rest saves hours on a 4-core
    #     runner. No clang either: bindgen's libclang 23 is copied in from
    #     LLVM's release archive.
    #
    # The cache key names the version and a recipe revision: bump the revision
    # when a flag here changes, or every job keeps restoring the old prefix.

    - name: Restore LLVM + MLIR 23 (Windows)
      if: runner.os == 'Windows'
      uses: actions/cache/restore@v4
      id: llvm-cache
      with:
        path: C:\LLVM
        key: llvm-mlir-23.1.2-x86_64-pc-windows-msvc-static-r1

    - name: Require a cached LLVM + MLIR 23 (Windows)
      if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true' && inputs.build != 'true'
      shell: bash
      run: |
        echo "::error::No cached LLVM + MLIR prefix; CI's windows_toolchain job builds it, and this job should have run after it"
        exit 1

    - name: Build LLVM + MLIR 23 (Windows)
      if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true' && inputs.build == 'true'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $version = "23.1.2"
        $sha256  = "c98bbef08a2b4c2613cd50e9aa9ae7b69b1fe6c16b2c40373bc0ab6116fdf78a"
        $src     = "llvm-project-$version.src"
        $url     = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$src.tar.xz"
        $work    = Join-Path $env:RUNNER_TEMP 'llvm'
        $archive = Join-Path $work "$src.tar.xz"
        $build   = Join-Path $work 'build'
        $prefix  = "C:\LLVM"

        New-Item -ItemType Directory -Force -Path $work | Out-Null
        Write-Host "Downloading $url ..."
        curl.exe -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o $archive $url
        if ($LASTEXITCODE -ne 0) { throw "curl failed (exit $LASTEXITCODE)" }
        $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
        if ($actual -ne $sha256) { throw "SHA-256 mismatch: expected $sha256, got $actual" }

        # Only the trees an LLVM + MLIR build reads. libc is one of them: LLVM's
        # configure fails without the libc shared headers even when the libc project
        # is off. The tarball's only symlinks in these trees sit in llvm/utils/mlgo-utils,
        # which Windows tar cannot create; LLVM_INCLUDE_UTILS=OFF below keeps CMake from
        # looking for that directory.
        tar.exe -xf $archive -C $work --exclude '*/mlgo-utils/*' `
          "$src/llvm" "$src/mlir" "$src/cmake" "$src/third-party" "$src/libc"
        if ($LASTEXITCODE -ne 0) { throw "tar extract failed (exit $LASTEXITCODE)" }

        # cl.exe and Ninja come from the Visual Studio developer environment.
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vs) { throw "No Visual Studio with the x64 C++ tools" }
        cmd.exe /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" | ForEach-Object {
          if ($_ -match '^([^=]+)=(.*)$') { Set-Item "env:$($Matches[1])" $Matches[2] }
        }
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
          choco install ninja -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install ninja failed (exit $LASTEXITCODE)" }
        }

        # Four compile jobs and two links keep the large MLIR translation units inside
        # the runner's memory.
        cmake -S "$work\$src\llvm" -B $build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          "-DCMAKE_INSTALL_PREFIX=$prefix" `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
          -DLLVM_ENABLE_PROJECTS=mlir `
          "-DLLVM_TARGETS_TO_BUILD=X86;NVPTX;AMDGPU" `
          -DLLVM_ENABLE_ASSERTIONS=OFF `
          -DLLVM_ENABLE_ZLIB=OFF `
          -DLLVM_ENABLE_ZSTD=OFF `
          -DLLVM_ENABLE_LIBXML2=OFF `
          -DLLVM_ENABLE_DIA_SDK=OFF `
          -DLLVM_BUILD_TOOLS=OFF `
          -DLLVM_BUILD_UTILS=OFF `
          -DLLVM_INCLUDE_UTILS=OFF `
          -DLLVM_INCLUDE_TESTS=OFF `
          -DMLIR_INCLUDE_TESTS=OFF `
          -DLLVM_INCLUDE_BENCHMARKS=OFF `
          -DLLVM_INCLUDE_EXAMPLES=OFF `
          -DLLVM_INCLUDE_DOCS=OFF `
          -DLLVM_PARALLEL_COMPILE_JOBS=4 `
          -DLLVM_PARALLEL_LINK_JOBS=2
        if ($LASTEXITCODE -ne 0) { throw "cmake configure failed (exit $LASTEXITCODE)" }

        cmake --build $build --target install
        if ($LASTEXITCODE -ne 0) { throw "LLVM + MLIR build failed (exit $LASTEXITCODE)" }

        # With LLVM_BUILD_TOOLS off, llvm-config is neither built nor installed by
        # default. Run from the prefix it reads its paths relative to itself.
        cmake --build $build --target llvm-config
        if ($LASTEXITCODE -ne 0) { throw "llvm-config build failed (exit $LASTEXITCODE)" }
        New-Item -ItemType Directory -Force -Path "$prefix\bin" | Out-Null
        Copy-Item (Join-Path $build 'bin\llvm-config.exe') "$prefix\bin\llvm-config.exe"

        # mlir-sys runs bindgen over the MLIR-C headers, and a libclang of another major
        # version lays their structs out wrong. The prefix builds no clang, so libclang 23
        # and its builtin headers come from LLVM's release archive, pinned by the SHA-256
        # GitHub records for it. libclang finds the headers relative to itself.
        $asset    = "clang+llvm-$version-x86_64-pc-windows-msvc"
        $release  = Join-Path $work "$asset.tar.xz"
        $clangSha = "8fb91cdc44fcbbdcf6b3ffd0a1f9859abd14a3c3aae4423c2b6d4a4f90bf0095"
        curl.exe -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o $release `
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$asset.tar.xz"
        if ($LASTEXITCODE -ne 0) { throw "curl failed (exit $LASTEXITCODE)" }
        $actual = (Get-FileHash -Algorithm SHA256 $release).Hash.ToLower()
        if ($actual -ne $clangSha) { throw "SHA-256 mismatch: expected $clangSha, got $actual" }
        tar.exe -xf $release -C $work "$asset/bin/libclang.dll" "$asset/lib/clang/23/include"
        if ($LASTEXITCODE -ne 0) { throw "tar extract failed (exit $LASTEXITCODE)" }
        Copy-Item (Join-Path $work "$asset\bin\libclang.dll") "$prefix\bin\libclang.dll"
        New-Item -ItemType Directory -Force -Path "$prefix\lib\clang\23" | Out-Null
        Copy-Item -Recurse (Join-Path $work "$asset\lib\clang\23\include") "$prefix\lib\clang\23\include"

        Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue

    - name: Save LLVM + MLIR 23 (Windows)
      if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true' && inputs.build == 'true'
      uses: actions/cache/save@v4
      with:
        path: C:\LLVM
        key: ${{ steps.llvm-cache.outputs.cache-primary-key }}

    - name: Configure LLVM env (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $prefix = "C:\LLVM"

        $llvmConfig = "$prefix\bin\llvm-config.exe"
        if (-not (Test-Path $llvmConfig)) {
          throw "llvm-config.exe not found at $llvmConfig"
        }

        $detected = & $llvmConfig --version
        Write-Host "Detected LLVM version: $detected"
        if ($detected -notmatch '^23\.') {
          throw "Unexpected LLVM version '$detected'; expected 23.x"
        }
        Write-Host "LLVM prefix: $prefix"

        # Every system library must be a bare name llvm-sys can turn into a rustc
        # `-l`, present in the SDK. A path here is a dependency the build above
        # should have turned off.
        $system = (& $llvmConfig --system-libs --link-static) -split '\s+' | Where-Object { $_ }
        Write-Host "llvm-config system libraries: $system"
        foreach ($lib in $system) {
          if ($lib -match '[:/\\]') { throw "llvm-config names '$lib' by path, which llvm-sys cannot link" }
        }
        if (-not (Test-Path "$prefix\include\mlir-c\IR.h")) { throw "MLIR-C headers missing from $prefix" }

        # bindgen loads the libclang 23 the build step put beside llvm-config, not the
        # runner's own LLVM, whose major version is whatever the image ships.
        $libclang = "$prefix\bin\libclang.dll"
        if (-not (Test-Path $libclang)) { throw "No libclang.dll at $libclang for bindgen" }

        # llvm-sys on Windows/MSVC links statically: do NOT set
        # LLVM_LINK_LLVM_DYLIB.
        "LLVM_SYS_231_PREFIX=$prefix" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
        "MLIR_SYS_230_PREFIX=$prefix" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
        "TABLEGEN_230_PREFIX=$prefix" | Out-File $env:GITHUB_ENV  -Append -Encoding utf8
        "LIBCLANG_PATH=$(Split-Path $libclang)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
        "$prefix\bin"                  | Out-File $env:GITHUB_PATH -Append -Encoding utf8

        # Under +crt-static, llvm-sys emits the system libraries llvm-config names
        # (psapi, shell32, ole32, uuid, advapi32, ws2_32, ntdll) as `static=` links.
        # rustc then has to find each .lib itself to bundle it into the llvm-sys
        # rlib, and it searches only its -L paths, never the linker's LIB, so it
        # fails with "could not find native static library `psapi`". The Windows
        # SDK directory that holds them is added as a search path. It goes into
        # Cargo's home config rather than RUSTFLAGS: Cargo joins config arrays,
        # while RUSTFLAGS would replace the repository's +crt-static.
        $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Lib'
        $sdk = Get-ChildItem $kits -Directory |
          Where-Object { Test-Path (Join-Path $_.FullName 'um\x64\psapi.lib') } |
          Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
        if (-not $sdk) { throw "No Windows SDK with um\x64\psapi.lib under $kits" }
        $um = Join-Path $sdk.FullName 'um\x64'
        Write-Host "Windows SDK libraries: $um"
        $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
        New-Item -ItemType Directory -Force -Path $cargoHome | Out-Null
        @"
        [target.x86_64-pc-windows-msvc]
        rustflags = ['-L', 'native=$um']
        "@ | Out-File (Join-Path $cargoHome 'config.toml') -Append -Encoding utf8

    - name: Verify LLVM prefix is set
      shell: bash
      run: |
        : "${LLVM_SYS_231_PREFIX:?LLVM_SYS_231_PREFIX is not set, LLVM install failed}"
        echo "LLVM_SYS_231_PREFIX = $LLVM_SYS_231_PREFIX"
        # Use llvm-config from PATH (bin dir was added above) to avoid
        # backslash path issues on Windows runners using Git Bash.
        llvm-config --version
