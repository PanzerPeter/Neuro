name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  lint:
    name: Formatter & Linter
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable as of v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1

      - name: Setup LLVM 23 (+ MLIR for --all-features)
        uses: ./.github/actions/setup-llvm
        with:
          mlir: "true"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run MLIR backend smoke test
        run: cargo test -p mlir-backend --features mlir

      # The driver routes tensor bodies through mlir-backend under this feature, so the
      # whole end-to-end suite and every example runs again on that path.
      - name: Run neurc suite with MLIR routing
        run: cargo test -p neurc --features mlir

  docs_hygiene:
    name: Docs Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Check docs hygiene
        run: python tools/check_docs_hygiene.py

  test:
    name: Test Suite
    # The VSA architecture tests run here too: they are part of the neurc test
    # target that `cargo test --workspace` builds, so a separate job would only
    # install LLVM a second time to run them again.
    needs: [lint]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust_version: [stable, nightly]
        exclude:
          # nightly is an early warning that a future rustc breaks the build, and
          # that break is not OS-specific. One leg reports it; the macOS and
          # Windows nightly legs only re-link LLVM to learn the same thing, and
          # being continue-on-error they can never block a merge either way.
          - os: macos-latest
            rust_version: nightly
          - os: windows-latest
            rust_version: nightly
    # Allow the nightly leg to fail without failing the whole workflow
    continue-on-error: ${{ matrix.rust_version == 'nightly' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2

      - name: Install Rust (${{ matrix.rust_version }})
        # Use @master (toolchain is a required input) when the channel varies by
        # matrix value. Pinning to @stable hardcodes the channel in the action
        # ref, so overriding it via `toolchain:` is unsupported and the nightly
        # leg bails out in the action's parse step.
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: ${{ matrix.rust_version }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          # Separate cache keys per OS + toolchain to avoid poisoning
          key: ${{ matrix.os }}-${{ matrix.rust_version }}

      - name: Setup LLVM 23
        uses: ./.github/actions/setup-llvm

      # The DLPack differential harness compares tensor results against NumPy through the
      # handle. Without NumPy those two tests skip rather than fail, so a leg missing this
      # step goes green while checking nothing.
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install NumPy for the DLPack differential harness
        run: python -m pip install --upgrade "numpy>=2.1"

      - name: Run Tests
        run: cargo test --workspace --all-targets --verbose

  benchmark_regression:
    name: Benchmark Regression
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable as of v1
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
      - name: Setup LLVM 23
        uses: ./.github/actions/setup-llvm
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run llvm-backend benchmarks
        run: cargo bench -p llvm-backend --bench codegen_bench -- --sample-size 10
      - name: Check benchmark regression budget
        run: |
          python tools/check_benchmark_regression.py \
            --baseline tools/benchmarks/llvm_backend_codegen_baseline.json \
            --results-root target/criterion \
            --threshold-ratio 0.35

  release:
    name: Release Build, Smoke Test & Artifacts
    needs: [test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable as of v1
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
        with:
          key: ${{ matrix.os }}-stable
      - name: Setup LLVM 23
        uses: ./.github/actions/setup-llvm
      - name: Build release neurc
        run: cargo build -p neurc --release

      # Each example returns a known value from `main`; the release binary must link it
      # and the program must exit with exactly that value.
      - name: Run release smoke tests
        shell: bash
        run: |
          ext='${{ runner.os == 'Windows' && '.exe' || '' }}'
          for case in function_call:8 factorial:120; do
            name=${case%%:*}; want=${case##*:}; exe="target/smoke-$name$ext"
            "target/release/neurc$ext" compile "examples/basics/$name.nr" -O 2 -o "$exe"
            "$exe" && got=0 || got=$?
            [ "$got" -eq "$want" ] || { echo "$name: expected exit $want, got $got"; exit 1; }
            echo "Smoke test passed: $name -> exit $got"
          done

      - name: Upload Compiler Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neurc-${{ runner.os }}
          path: target/release/neurc${{ runner.os == 'Windows' && '.exe' || '' }}

  coverage:
    name: Code Coverage
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable as of v1
        with:
          toolchain: stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.8.1
      - name: Setup LLVM 23 (+ MLIR for the mlir feature)
        uses: ./.github/actions/setup-llvm
        with:
          mlir: "true"
      - name: Install tarpaulin
        uses: taiki-e/install-action@15449e3094499af05d8d964a1c884208e4b8b595 # v2.62.13
        with:
          tool: cargo-tarpaulin
      - name: Generate Coverage
        # --features mlir so the HIR->MLIR lowering in mlir-backend is measured;
        # without it the Phase 1.8 mlir-gated code reports as 0% covered.
        run: cargo tarpaulin --workspace --features mlir --verbose --timeout 300 --out Xml
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5.5.1
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
