[workspace]
resolver = "3"

members = [
    # Infrastructure Components (Shared across slices)
    "compiler/infrastructure/shared-types",
    "compiler/infrastructure/ast-types",
    "compiler/infrastructure/neuro-hir",

    # Phase 1: Core Compiler Slices
    "compiler/lexical-analysis",
    "compiler/syntax-parsing",
    "compiler/module-resolution",
    "compiler/argument-binding",
    "compiler/semantic-analysis",
    "compiler/llvm-backend",

    # Phase 1.8: HIR & MLIR Backend Plumbing
    "compiler/hir-lowering",
    "compiler/mlir-backend",

    # Compiler Driver
    "compiler/neurc",
]

[workspace.package]
version = "5.5.0"
edition = "2024"
rust-version = "1.98.1"
authors = ["Neuro Contributors"]
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Core dependencies used across multiple crates
thiserror = "2.0"
anyhow = "1.0"

# Lexical Analysis
logos = "0.16"

# LLVM Backend
# Requires LLVM 23 with dev libraries (the backend emits LLVM IR via inkwell).
# LLVM_SYS_231_PREFIX points at that install: /usr on Arch/CachyOS, whose stock
# `llvm` is 23. Feature flag llvm23-1 (inkwell's minor-version suffix scheme).
# LLVM 23 support is on inkwell's master but in no crates.io release yet, so the
# dependency is pinned to that commit; move back to a version once 0.11 ships.
# default-features = false disables inkwell's `target-all` default, which would
# otherwise compile in initializers for every LLVM target (ARM, BPF, Mips, ...).
# That fails to link against LLVM's official Windows build, which ships only a
# subset of backends. We only ever initialize the native (x86) target.
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "e27198562729488a493e8110b4d925875eb917cb", default-features = false, features = ["llvm23-1", "target-x86"] }

# MLIR Backend (Phase 1.8+)
# Rust MLIR bindings for the tensor lowering path, behind mlir-backend's `mlir`
# feature. melior 0.28.x is the MLIR 23 line (via mlir-sys 230). mlir-sys finds
# MLIR through `$MLIR_SYS_230_PREFIX/bin/llvm-config`, so MLIR must be installed
# into the same prefix as the LLVM that LLVM_SYS_231_PREFIX names: `bridge.rs`
# hands an `LLVMContextRef` from MLIR's libLLVM to inkwell, so both must load one
# libLLVM 23. TABLEGEN_230_PREFIX names the same prefix for mlir-tblgen.
melior = "0.28.2"

# melior does not wrap `mlirTranslateModuleToLLVMIR`, so the MLIR -> LLVM IR
# crossing calls it through the raw bindings. Pinned to the version melior
# itself depends on, so both reach the SAME `mlir-sys` instance and its
# `MlirOperation` / `LLVMContextRef` types unify.
mlir-sys = "230.0.2"

# Serialization
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"

# Temporary directories (driver build scratch, test fixtures)
tempfile = "3.8"

# Testing
criterion = "0.8"

# Lints every member opts into with `[lints] workspace = true`. A suppression is
# `#[expect(...)]`, never `#[allow(...)]`: an expectation that stops firing is itself
# a warning, so a stale suppression cannot outlive the code it excused.
[workspace.lints.clippy]
allow_attributes = "warn"

[profile.dev]
split-debuginfo = "unpacked"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 1

[profile.bench]
lto = true

# Custom profile for faster development builds
[profile.dev-optimized]
inherits = "dev"
opt-level = 1

