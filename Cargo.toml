[workspace]
resolver = "2"

members = [
    # Infrastructure Components (Shared across slices)
    "compiler/infrastructure/shared-types",
    "compiler/infrastructure/ast-types",
    "compiler/infrastructure/neuro-hir",

    # Phase 1: Core Compiler Slices
    "compiler/lexical-analysis",
    "compiler/syntax-parsing",
    "compiler/module-resolution",
    "compiler/argument-binding",
    "compiler/semantic-analysis",
    "compiler/llvm-backend",

    # Phase 1.8: HIR & MLIR Backend Plumbing
    "compiler/hir-lowering",
    "compiler/mlir-backend",

    # Compiler Driver
    "compiler/neurc",
]

[workspace.package]
version = "4.4.0"
edition = "2021"
rust-version = "1.85"
authors = ["Neuro Contributors"]
license-file = "LICENSE"
publish = false

[workspace.dependencies]
# Core dependencies used across multiple crates
thiserror = "2.0"
anyhow = "1.0"

# Lexical Analysis
logos = "0.16"

# LLVM Backend
# Requires LLVM 22 with dev libraries (the backend emits LLVM IR via inkwell).
# LLVM_SYS_221_PREFIX points at that install: /usr on Arch/CachyOS, whose stock
# `llvm` is 22. Feature flag llvm22-1 (inkwell's minor-version suffix scheme).
# default-features = false disables inkwell's `target-all` default, which would
# otherwise compile in initializers for every LLVM target (ARM, BPF, Mips, ...).
# That fails to link against LLVM's official Windows build, which ships only a
# subset of backends. We only ever initialize the native (x86) target.
inkwell = { version = "0.10.0", default-features = false, features = ["llvm22-1", "target-x86"] }

# MLIR Backend (Phase 1.8+)
# Rust MLIR bindings for the tensor lowering path, behind mlir-backend's `mlir`
# feature. melior 0.27.x is the last line on MLIR 22 (via mlir-sys 220); 0.28
# moved to MLIR 23. mlir-sys finds MLIR through `$MLIR_SYS_220_PREFIX/bin/
# llvm-config`, so MLIR must be installed into the same prefix as the LLVM that
# LLVM_SYS_221_PREFIX names: `bridge.rs` hands an `LLVMContextRef` from MLIR's
# libLLVM to inkwell, so both must load one libLLVM 22. TABLEGEN_220_PREFIX
# names the same prefix for mlir-tblgen.
melior = "0.27.8"

# melior does not wrap `mlirTranslateModuleToLLVMIR`, so the MLIR -> LLVM IR
# crossing calls it through the raw bindings. Pinned to the version melior
# itself depends on, so both reach the SAME `mlir-sys` instance and its
# `MlirOperation` / `LLVMContextRef` types unify.
mlir-sys = "220.0.2"

# Serialization
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"

# Testing
criterion = "0.8"

[profile.dev]
split-debuginfo = "unpacked"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.test]
opt-level = 1

[profile.bench]
lto = true

# Custom profile for faster development builds
[profile.dev-optimized]
inherits = "dev"
opt-level = 1

