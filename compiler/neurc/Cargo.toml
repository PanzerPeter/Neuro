[package]
name = "neurc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Infrastructure
neuro-hir = { path = "../infrastructure/neuro-hir" }
ast-types = { path = "../infrastructure/ast-types" }
shared-types = { path = "../infrastructure/shared-types" }

# Feature Slices
syntax-parsing = { path = "../syntax-parsing" }
module-resolution = { path = "../module-resolution" }
argument-binding = { path = "../argument-binding" }
semantic-analysis = { path = "../semantic-analysis" }
hir-lowering = { path = "../hir-lowering" }
llvm-backend = { path = "../llvm-backend" }
mlir-backend = { path = "../mlir-backend", optional = true }

# CLI Dependencies
clap = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }

# Compilation and Linking
tempfile = { workspace = true }

[features]
# Route the tensor bodies MLIR computes exactly as the LLVM backend would through
# mlir-backend. Needs an MLIR 22 toolchain at build time, like mlir-backend's own
# feature; without it every body stays on the LLVM backend. See CONTEXT.md.
default = []
mlir = ["dep:mlir-backend", "mlir-backend/mlir"]
