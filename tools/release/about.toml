# cargo-about configuration for the notices file in the Linux release tarball.
# A crate under a license missing here fails the release until it is reviewed and added.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-unknown-linux-gnu"]
# Build scripts and tests are not compiled into the binary.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are under LICENSE, shipped beside this file.
private = { ignore = true }
